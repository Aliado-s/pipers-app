<section class="hero">
    <div class="hero-container">
        <div class="hero-content">
            <span class="hero-eyebrow">
                PIPERS
            </span>
            <h1>
                Kabil SRL
            </h1>
            <p>
                Metalúrgica ubicada en Neuquén Capital, dedicada a la comercialización y distribución de productos metalúrgicos de alta calidad.
            </p>
            <div class="hero-actions">
                <app-button icon="arrow_forward">
                    Contactar a Pipers
                </app-button>
            </div>
        </div>
        <div class="hero-visual">
            <div class="glow"></div>
            <div class="hero-card">
                <app-icon name="smart_toy" [size]="64">
                </app-icon>
                <p>
                    Metalúrgica PIPERS
                </p>
            </div>
            <img src="/assets/pipers-logo.png" alt="Logo Pipers" class="hero-logo">
        </div>
    </div>
</section>
