<button class="btn" [class.btn-primary]="variant === 'primary'" [class.btn-secondary]="variant === 'secondary'"
  [class.btn-ghost]="variant === 'ghost'" [type]="type" [disabled]="disabled">

  <span>
    <ng-content></ng-content>
  </span>


  @if(icon){
  <app-icon class="card-icon" [name]="icon" [size]="24">
  </app-icon>

  }

</button>
